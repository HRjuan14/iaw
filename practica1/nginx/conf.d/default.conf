# Definición de la zona de limitación de tasa (10MB almacenan ~160.000 IPs)
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=3r/s;

# 1. Redirección HTTP -> HTTPS
server {
    listen 80;
    server_name HRjuandragontech.local www.HRjuandragontech.local HRshadowbyte.local www.HRshadowbyte.local;

    return 301 https://$host$request_uri;
}

# 2. Bloque HTTPS
server {
    listen 443 ssl;
    server_name HRjuandragontech.local www.HRjuandragontech.local HRshadowbyte.local www.HRshadowbyte.local;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    # --- CABECERAS DE SEGURIDAD ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        # Limitación de peticiones
        limit_req zone=req_limit_per_ip burst=5 nodelay;

        proxy_pass http://nimbusdocs01:13;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
