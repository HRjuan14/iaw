<VirtualHost *:80>
    ServerName HRshadowbyte.local
    ServerAlias www.HRshadowbyte.local

    DocumentRoot /var/www/html/HRshadowbyte

    ErrorLog /var/log/apache2/HRshadowbyte_error.log
    CustomLog /var/log/apache2/HRshadowbyte_access.log combined

    <Directory /var/www/html/HRshadowbyte>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Protección del fichero sensible
        <Files "datos_secretos_v1.env">
            Require all denied
        </Files>
    </Directory>
</VirtualHost>