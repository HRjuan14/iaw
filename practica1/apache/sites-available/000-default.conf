<VirtualHost *:80>
    ServerName default.local
    ServerAlias *
    
    DocumentRoot /var/www/html/default
    
    ErrorLog /var/log/apache2/default_error.log
    CustomLog /var/log/apache2/default_access.log combined

    <Directory /var/www/html/default>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>