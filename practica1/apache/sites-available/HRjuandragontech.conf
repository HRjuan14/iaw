<VirtualHost *:80>
    ServerName HRjuandragontech.local
    ServerAlias www.HRjuandragontech.local

    DocumentRoot /var/www/html/HRjuandragontech

    ErrorLog /var/log/apache2/HRjuandragontech_error.log
    CustomLog /var/log/apache2/HRjuandragontech_access.log combined

    <Directory /var/www/html/HRjuandragontech>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>