version: '2.4'

services:
  web:
    build: .
    container_name: nimbusdocs01
    volumes:
      - ./web:/usr/local/apache2/htdocs
      - ./apache/conf/vhosts.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf
    # Eliminamos 'ports' para que Apache quede aislado en la red interna de Docker

  proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - web
