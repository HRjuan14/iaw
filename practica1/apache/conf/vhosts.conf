# 1. VirtualHost por defecto (Comportamiento controlado para dominios no autorizados)
<VirtualHost *:13>
    ServerName default.local
    DocumentRoot /usr/local/apache2/htdocs
    <Directory /usr/local/apache2/htdocs>
        Require all denied
    </Directory>
</VirtualHost>

# 2. Virtual host de HRjuandragontech.local
<VirtualHost *:13>
    ServerName HRjuandragontech.local
    ServerAlias www.HRjuandragontech.local
    DocumentRoot /usr/local/apache2/htdocs/HRjuandragontech
    ErrorLog logs/HRjuandragontech_error.log
    CustomLog logs/HRjuandragontech_access.log combined

    <Directory /usr/local/apache2/htdocs/HRjuandragontech>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

# 3. Virtual host de HRshadowbyte.local
<VirtualHost *:13>
    ServerName HRshadowbyte.local
    ServerAlias www.HRshadowbyte.local
    DocumentRoot /usr/local/apache2/htdocs/HRshadowbyte
    ErrorLog logs/HRshadowbyte_error.log
    CustomLog logs/HRshadowbyte_access.log combined    

    <Directory /usr/local/apache2/htdocs/HRshadowbyte>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Bloquear un archivo sensible específico
    <Files "configurar.php">
        Require all denied
    </Files>
</VirtualHost>
